```yaml
name: Day3 Azure Terraform Flask

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: Day3/terraform
  APP_DIR: Day3/app
  AZURE_WEBAPP_NAME: bhargav-day3-app-2026

jobs:

  # ============================================================
  # STAGE 1 - BUILD
  # ============================================================
  build:
    name: Stage 1 - Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Flask application syntax
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m py_compile app.py

      - name: Upload Flask application
        uses: actions/upload-artifact@v4
        with:
          name: flask-app
          path: |
            Day3/app/app.py
            Day3/app/requirements.txt
            Day3/app/templates/


  # ============================================================
  # STAGE 2 - DEPLOY INFRASTRUCTURE
  # ============================================================
  deploy-infrastructure:
    name: Stage 2 - Deploy Infrastructure
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform apply -auto-approve


  # ============================================================
  # STAGE 3 - DEPLOY APPLICATION
  # ============================================================
  deploy-application:
    name: Stage 3 - Deploy Flask Application
    needs: deploy-infrastructure
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Flask application
        uses: actions/download-artifact@v4
        with:
          name: flask-app
          path: deploy

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Flask application
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy
```
