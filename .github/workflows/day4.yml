name: Day4 UI API Pipeline

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  UI_APP_NAME: day4-ui-bhargav
  API_APP_NAME: day4-api-bhargav

jobs:

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      ui_changed: ${{ steps.filter.outputs.ui }}
      api_changed: ${{ steps.filter.outputs.api }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect UI and API changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ui:
              - 'Day4/ui/**'
            api:
              - 'Day4/api/**'


  build-ui:
    name: Build UI
    needs: detect-changes
    if: needs.detect-changes.outputs.ui_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate UI files
        run: |
          test -f Day4/ui/index.html
          test -f Day4/ui/style.css
          test -f Day4/ui/script.js

      - name: Package UI
        run: |
          mkdir -p build
          cd Day4/ui
          zip -r ../../build/ui.zip .

      - name: Upload UI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-package
          path: build/ui.zip


  build-api:
    name: Build API
    needs: detect-changes
    if: needs.detect-changes.outputs.api_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        working-directory: Day4/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check API syntax
        working-directory: Day4/api
        run: |
          python -m py_compile app.py

      - name: Package API
        run: |
          mkdir -p build
          cd Day4/api
          zip -r ../../build/api.zip app.py requirements.txt

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-package
          path: build/api.zip


  deploy-ui:
    name: Deploy UI
    needs: build-ui
    if: needs.build-ui.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download UI artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-package
          path: build

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy UI
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.UI_APP_NAME }}
          package: build/ui.zip


  deploy-api:
    name: Deploy API
    needs: build-api
    if: needs.build-api.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-package
          path: build

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.API_APP_NAME }}
          package: build/api.zip